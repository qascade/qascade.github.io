{% extends "base.html" %}
{% block title %}{{ page.title }} - {{ site.title }}{% endblock %}
{% block description %}{{ page.description or site.tagline }}{% endblock %}
{% block content %}
<article class="post page">
  <header class="post-header align-left">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <div class="post-body">{{ page.html }}</div>
</article>
{% endblock %}
